<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/matter-mark.svg" />
    <link rel="apple-touch-icon" href="/matter-mark.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400&display=swap" rel="stylesheet" />
    <script>
      (() => {
        const params = new URLSearchParams(window.location.search);
        const urlSkin = params.get("skin");
        let storedSkin = null;
        try {
          storedSkin = window.localStorage.getItem("matter.skin");
        } catch {
          storedSkin = null;
        }
        document.documentElement.dataset.skin =
          urlSkin === "forest" || urlSkin === "matter"
            ? urlSkin
            : storedSkin === "forest" || storedSkin === "matter"
              ? storedSkin
              : "forest";
      })();
    </script>
    <title>matter</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
