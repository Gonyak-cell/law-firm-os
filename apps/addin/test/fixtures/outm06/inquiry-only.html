<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OUTM-06 fixture</title>
    <style>
      :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #17212b; background: #f7f9fb; }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-width: 0; overflow-x: hidden; }
      body { padding: 12px; }
      [data-ui-shell="outm-06"] { width: 100%; max-width: 480px; margin: 0 auto; padding: 16px; border: 1px solid #d7dee7; border-radius: 8px; background: #fff; }
      header, nav, .critical-row, .field-row { display: flex; align-items: center; gap: 8px; min-width: 0; }
      header { justify-content: space-between; }
      nav { margin: 12px 0; }
      h1, h2, p { margin: 0; }
      h1 { font-size: 18px; }
      h2 { font-size: 14px; margin-bottom: 8px; }
      h1, h2, p, button, section span, code { display: block; max-width: 100%; overflow: hidden; white-space: nowrap; }
      [data-ui-critical-value] { display: block; min-width: 0; max-width: 100%; flex: 1 1 auto; overflow-x: auto; overflow-y: hidden; white-space: nowrap; text-overflow: clip; font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; padding: 7px; border: 1px solid #b8c5d3; border-radius: 4px; }
      section span:not(.sr-only) { text-overflow: ellipsis; }
      .field-row { margin: 12px 0; }
      input { min-width: 0; width: 100%; padding: 8px; border: 1px solid #aab8c7; border-radius: 4px; }
      button { min-height: 36px; padding: 7px 10px; border: 1px solid #6e7d8d; border-radius: 4px; background: #fff; color: inherit; text-overflow: ellipsis; }
      button:has(svg), a:has(svg) { width: 36px; min-width: 36px; height: 36px; padding: 0; display: inline-grid; place-items: center; }
      button:focus-visible, input:focus-visible, button:has(svg):focus-visible, [data-ui-critical-value]:focus-visible { outline: 2px solid #135e96; outline-offset: 2px; }
      .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
      header { transition: transform .2s ease; animation: outm06-pulse .2s ease; }
      @keyframes outm06-pulse { from { opacity: .8; } to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
      }
    </style>
  </head>
  <body>
    <main data-ui-shell="outm-06" data-outlook-profile="inquiry-only">
      <header>
        <h1>문의 연결</h1>
        <button type="button" aria-label="도움말"><svg aria-hidden="true" viewBox="0 0 16 16"></svg></button>
      </header>
      <nav aria-label="Outlook 기능">
        <button type="button" aria-label="새 문의 만들기"><svg aria-hidden="true" viewBox="0 0 16 16"></svg></button>
        <button type="button" aria-label="기존 문의에 연결"><svg aria-hidden="true" viewBox="0 0 16 16"></svg></button>
      </nav>
      <section aria-labelledby="inquiry-search-label">
        <h2 id="inquiry-search-label">문의 검색</h2>
        <div class="field-row">
          <input id="inquiry-search" type="search" aria-label="문의 검색어" placeholder="검색">
          <button type="button" aria-label="검색 실행">검색</button>
        </div>
      </section>
      <section aria-labelledby="inquiry-value-label">
        <h2 id="inquiry-value-label">현재 문의</h2>
        <div class="field-row">
          <span aria-label="문의 제목">계약 검토 문의</span>
        </div>
        <div class="critical-row">
          <code id="inquiry-critical-value" data-ui-critical-value="true" tabindex="0" aria-label="문의 원본 식별자">inquiry:2026:contract-review:immutable:000000000000000000000000000000000000000000000000</code>
          <button type="button" aria-label="문의 원본 식별자 복사" aria-controls="inquiry-critical-value"><svg aria-hidden="true" viewBox="0 0 16 16"></svg></button>
        </div>
      </section>
      <p role="alert" aria-controls="inquiry-error-full">문의 연결에 실패했습니다.</p>
      <span id="inquiry-error-full" class="sr-only" aria-live="polite">문의 연결에 실패했습니다. 원본 메일 식별자와 권한을 확인한 뒤 다시 시도해 주세요. 오류 식별자 OUTM06-INQUIRY-001.</span>
    </main>
  </body>
</html>
