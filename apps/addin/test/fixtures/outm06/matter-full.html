<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OUTM-06 fixture</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #17212b;
        background: #f7f9fb;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-width: 0; overflow-x: hidden; }
      body { padding: 12px; }
      [data-ui-shell="outm-06"] {
        width: 100%;
        max-width: 480px;
        margin: 0 auto;
        padding: 16px;
        border: 1px solid #d7dee7;
        border-radius: 8px;
        background: #fff;
      }
      header, nav, .critical-row, .field-row { display: flex; align-items: center; gap: 8px; min-width: 0; }
      header { justify-content: space-between; }
      nav { margin: 12px 0; }
      h1, h2, p { margin: 0; }
      h1 { font-size: 18px; }
      h2 { font-size: 14px; margin-bottom: 8px; }
      h1, h2, p, button, section span, code {
        display: block;
        max-width: 100%;
        overflow: hidden;
        white-space: nowrap;
      }
      [data-ui-critical-value] {
        display: block;
        min-width: 0;
        max-width: 100%;
        flex: 1 1 auto;
        overflow-x: auto;
        overflow-y: hidden;
        white-space: nowrap;
        text-overflow: clip;
        font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
        padding: 7px;
        border: 1px solid #b8c5d3;
        border-radius: 4px;
      }
      section span:not(.sr-only) { text-overflow: ellipsis; }
      .field-row { margin: 12px 0; }
      input { min-width: 0; width: 100%; padding: 8px; border: 1px solid #aab8c7; border-radius: 4px; }
      button { min-height: 36px; padding: 7px 10px; border: 1px solid #6e7d8d; border-radius: 4px; background: #fff; color: inherit; text-overflow: ellipsis; }
      button:has(svg), a:has(svg) {
        width: 36px;
        min-width: 36px;
        height: 36px;
        padding: 0;
        display: inline-grid;
        place-items: center;
      }
      button:focus-visible, input:focus-visible, button:has(svg):focus-visible, [data-ui-critical-value]:focus-visible {
        outline: 2px solid #135e96;
        outline-offset: 2px;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      header { transition: transform .2s ease; animation: outm06-pulse .2s ease; }
      @keyframes outm06-pulse { from { opacity: .8; } to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: .01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: .01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <main data-ui-shell="outm-06" data-outlook-profile="matter-full">
      <header>
        <h1>Matter 메일 작업</h1>
        <button type="button">
          <svg aria-hidden="true" viewBox="0 0 16 16"><path d="M8 2v12M2 8h12"></path></svg>
          <span class="sr-only">도움말</span>
        </button>
      </header>
      <nav aria-label="Outlook 기능">
        <button type="button" aria-label="저장 위치 선택"><svg aria-hidden="true" viewBox="0 0 16 16"></svg></button>
        <button type="button" aria-label="메일 저장"><svg aria-hidden="true" viewBox="0 0 16 16"></svg></button>
        <button type="button" aria-label="관련 작업 만들기"><svg aria-hidden="true" viewBox="0 0 16 16"></svg></button>
      </nav>
      <section aria-labelledby="matter-search-label">
        <h2 id="matter-search-label">Matter 검색</h2>
        <div class="field-row">
          <input id="matter-search" type="search" aria-label="Matter 검색어" placeholder="검색">
          <button type="button" aria-label="검색 실행">검색</button>
        </div>
      </section>
      <section aria-labelledby="matter-value-label">
        <h2 id="matter-value-label">선택한 Matter</h2>
        <div class="field-row">
          <span aria-label="Matter 이름">계약 검토 의뢰</span>
        </div>
        <div class="critical-row">
          <code id="matter-critical-value" data-ui-critical-value="true" tabindex="0" aria-label="Matter 원본 식별자">matter:2026:contract-review:immutable:000000000000000000000000000000000000000000000000</code>
          <button type="button" aria-label="Matter 원본 식별자 복사" aria-controls="matter-critical-value"><svg aria-hidden="true" viewBox="0 0 16 16"></svg></button>
        </div>
      </section>
      <p role="alert" aria-controls="matter-error-full">저장하지 못했습니다.</p>
      <span id="matter-error-full" class="sr-only" aria-live="polite">저장하지 못했습니다. Matter 원본과 첨부 파일을 확인한 뒤 다시 시도해 주세요. 오류 식별자 OUTM06-MATTER-001.</span>
    </main>
  </body>
</html>
