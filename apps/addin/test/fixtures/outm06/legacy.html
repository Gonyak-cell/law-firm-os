<!doctype html>
<html lang="ko">
  <body>
    <main class="addin-shell" data-outlook-addin-taskpane="true" data-ui-shell="outm-06" data-outlook-profile="matter-full">
      <header class="pane-header">
        <p class="eyebrow">Outlook</p>
        <h1>메일 처리</h1>
        <span class="mode-badge" title="확인 후 저장">확인 후 저장</span>
      </header>
      <section class="status-stack status-grid" aria-label="연결 상태">
        <span class="status-line">로그인됨</span>
      </section>
      <p class="pane-subtitle">현재 메일</p>
      <p class="helper-text">처리할 메일을 선택하면 내용이 표시됩니다.</p>
      <button><svg></svg></button>
      <input placeholder="검색">
      <span data-ui-critical-value="true">critical value is truncated</span>
      <span>ordinary value without ellipsis</span>
      <p>오류가 발생했습니다. 전체 오류 정보를 표시합니다.</p>
    </main>
  </body>
</html>
