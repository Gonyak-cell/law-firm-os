name: Windows Formal Package QA

on:
  push:
    branches:
      - codex/integration/forest-v0.1.17
    paths:
      - .github/workflows/windows-formal-package-qa.yml
      - apps/desktop/**
      - apps/web/**
      - package.json
      - package-lock.json
      - scripts/build-matter-desktop-win-installer.mjs
      - scripts/build-matter-desktop-win.mjs
      - scripts/prepare-matter-desktop-web-renderer.mjs
      - scripts/run-formal-windows-package-qa.mjs
      - scripts/lib/matter-desktop-authenticode.mjs
      - scripts/lib/matter-desktop-provenance.mjs
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full clean source SHA to build and test
        required: true
        type: string

permissions:
  contents: read

env:
  QA_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}

jobs:
  windows-formal-package-qa:
    name: Windows formal install and runtime QA
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Configure deterministic Git line endings
        shell: pwsh
        run: git config --global core.autocrlf false

      - name: Checkout exact source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.QA_SOURCE_SHA }}
          fetch-depth: 0

      - name: Verify source input
        shell: pwsh
        run: |
          if ("${{ env.QA_SOURCE_SHA }}" -notmatch '^[0-9a-f]{40}$') { throw "source_sha must be a full SHA" }
          if ((git rev-parse HEAD).Trim() -ne "${{ env.QA_SOURCE_SHA }}") { throw "exact source checkout failed" }
          if (git status --porcelain) { throw "source checkout is dirty" }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build exact-source formal Windows package and NSIS
        env:
          MATTER_DESKTOP_RELEASE_CHANNEL: formal
          MATTER_DESKTOP_EXPECTED_SOURCE_SHA: ${{ env.QA_SOURCE_SHA }}
          MATTER_DESKTOP_WINDOWS_BUILD_RECEIPT_PATH: ${{ runner.temp }}\matter-desktop-windows-receipt-${{ github.run_id }}-${{ github.run_attempt }}\windows-build.md
        shell: pwsh
        run: |
          npm --workspace apps/desktop run prepare:web-renderer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --workspace apps/desktop run build:win
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --workspace apps/desktop run build:win:installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run native install, login, leave, payroll, restart, and uninstall QA
        env:
          MATTER_DESKTOP_EXPECTED_SOURCE_SHA: ${{ env.QA_SOURCE_SHA }}
          MATTER_FORMAL_WINDOWS_QA_ARTIFACT_DIR: ${{ runner.temp }}\matter-formal-package-qa-${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/run-formal-windows-package-qa.mjs

      - name: Verify native result and preserve signing boundary
        env:
          MATTER_FORMAL_WINDOWS_QA_ARTIFACT_DIR: ${{ runner.temp }}\matter-formal-package-qa-${{ github.run_id }}-${{ github.run_attempt }}
        shell: pwsh
        run: |
          $receipt = Get-Content -Raw -LiteralPath (Join-Path $env:MATTER_FORMAL_WINDOWS_QA_ARTIFACT_DIR "formal-windows-package-qa.json") | ConvertFrom-Json
          if ($receipt.native_verdict -ne "PASS") { throw "Windows native QA did not pass" }
          if ($receipt.scenarios.PSObject.Properties.Value -contains $false) { throw "A Windows native scenario failed" }
          if ($receipt.authenticode.valid -eq $false -and $receipt.verdict -ne "BLOCKED_AUTHENTICODE") { throw "Unsigned artifact boundary is inconsistent" }

      - name: Copy build provenance
        if: always()
        env:
          MATTER_DESKTOP_WINDOWS_BUILD_RECEIPT_PATH: ${{ runner.temp }}\matter-desktop-windows-receipt-${{ github.run_id }}-${{ github.run_attempt }}\windows-build.md
          MATTER_FORMAL_WINDOWS_QA_ARTIFACT_DIR: ${{ runner.temp }}\matter-formal-package-qa-${{ github.run_id }}-${{ github.run_attempt }}
        shell: pwsh
        run: |
          $buildDir = Join-Path $env:MATTER_FORMAL_WINDOWS_QA_ARTIFACT_DIR "build"
          $artifactsDir = Join-Path $env:MATTER_FORMAL_WINDOWS_QA_ARTIFACT_DIR "artifacts"
          New-Item -ItemType Directory -Force $buildDir | Out-Null
          New-Item -ItemType Directory -Force $artifactsDir | Out-Null
          $desktopVersion = (Get-Content -Raw "apps\desktop\package.json" | ConvertFrom-Json).version
          $buildEvidence = @(
            "apps\desktop\dist\win\matter-$desktopVersion-win-build-manifest.json",
            "apps\desktop\dist\win\matter-$desktopVersion-win-installer-manifest.json",
            "apps\desktop\dist\win\matter-$desktopVersion-win-installer-manifest.json.sig",
            $env:MATTER_DESKTOP_WINDOWS_BUILD_RECEIPT_PATH
          )
          $windowsArtifacts = @(
            "apps\desktop\dist\matter-$desktopVersion-win-x64.exe",
            "apps\desktop\dist\matter-$desktopVersion-win-x64.exe.blockmap",
            "apps\desktop\dist\win\matter-$desktopVersion-win32-x64-unsigned.zip"
          )
          foreach ($path in $buildEvidence) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "missing Windows build evidence: $path" }
            Copy-Item -LiteralPath $path -Destination $buildDir
          }
          foreach ($path in $windowsArtifacts) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "missing Windows artifact: $path" }
            Copy-Item -LiteralPath $path -Destination $artifactsDir
          }
          Copy-Item "apps\desktop\dist\win-unpacked\resources\app\src\renderer\web" (Join-Path $buildDir "renderer") -Recurse

      - name: Upload Windows QA evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: windows-formal-package-qa-${{ env.QA_SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/matter-formal-package-qa-${{ github.run_id }}-${{ github.run_attempt }}/
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload failed Windows QA diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-formal-package-qa-failure-${{ env.QA_SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/matter-formal-package-qa-${{ github.run_id }}-${{ github.run_attempt }}/build/
            ${{ runner.temp }}/matter-formal-package-qa-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/
            ${{ runner.temp }}/matter-formal-package-qa-${{ github.run_id }}-${{ github.run_attempt }}/formal-windows-failure-cleanup.json
            ${{ runner.temp }}/matter-formal-package-qa-${{ github.run_id }}-${{ github.run_attempt }}/windows-installed-tree-sbom.cdx.json
            ${{ runner.temp }}/matter-formal-package-qa-${{ github.run_id }}-${{ github.run_attempt }}/*.png
          include-hidden-files: true
          if-no-files-found: warn
