name: JSON to PostgreSQL Program Security

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/json-postgres-program-security.yml"
      - "apps/api/**"
      - "infra/lawos-production/**"
      - "packages/dms/**"
      - "packages/hrx/**"
      - "packages/persistence/**"
      - "packages/runtime-auth/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/json-postgres-program-security.yml"
      - "apps/api/**"
      - "infra/lawos-production/**"
      - "packages/dms/**"
      - "packages/hrx/**"
      - "packages/persistence/**"
      - "packages/runtime-auth/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  json-postgres-program-security:
    name: JSON PostgreSQL exact-head security
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm

      - name: Expose local PostgreSQL binaries
        shell: bash
        run: |
          set -euo pipefail
          pg_bindir="$(pg_config --bindir)"
          test -x "${pg_bindir}/initdb"
          test -x "${pg_bindir}/pg_ctl"
          echo "${pg_bindir}" >> "${GITHUB_PATH}"

      - name: Install without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: PostgreSQL authority and security tests with zero skips
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 --test-reporter=tap \
            apps/api/test/auth-concurrency.test.js \
            apps/api/test/auth-restart-revocation.test.js \
            apps/api/test/break-glass-postgres.test.js \
            apps/api/test/finance-postgres-adapter.test.js \
            apps/api/test/immutable-program-input.test.js \
            apps/api/test/json-postgres-program-admin-lambda.test.js \
            apps/api/test/json-postgres-program-inputs.test.js \
            apps/api/test/json-postgres-source-transform.test.js \
            apps/api/test/member-photo-storage-composition.test.js \
            apps/api/test/persistence-authority.test.js \
            apps/api/test/postgres-api-runtime-authority.test.js \
            apps/api/test/postgres-vault-dms-api.test.js \
            apps/api/test/private-staging-cut006.test.js \
            apps/api/test/production-lawos-role-registry.test.js \
            apps/api/test/session-auth-api.test.js \
            apps/api/test/vault-dms-governance-security.test.js \
            apps/api/test/vault-dms-postgres-runtime.test.js \
            packages/dms/test/central-ledger.test.js \
            packages/dms/test/json-postgres-dms-migration.test.js \
            packages/dms/test/postgres-security-regressions.test.js \
            packages/dms/test/upload-reconciliation.test.js \
            packages/hrx/test/postgres-migrations.test.js \
            packages/hrx/test/postgres-projection-role.test.js \
            packages/hrx/test/postgres-store-v2.test.js \
            packages/hrx/test/relational-projection-contract.test.js \
            packages/hrx/test/relational-projection-validation.test.js \
            packages/hrx/test/relational-read-projection.test.js \
            packages/persistence/test/authority-bundle.test.js \
            packages/persistence/test/domain-ledger.test.js \
            packages/persistence/test/dr-recovery-contract.test.js \
            packages/persistence/test/json-postgres-migration.test.js \
            packages/persistence/test/migration-executor.test.js \
            packages/persistence/test/migration-reconciliation.test.js \
            packages/persistence/test/performance-acceptance.test.js \
            packages/persistence/test/postgres-application-role.test.js \
            packages/persistence/test/postgres-repository-contract.test.js \
            packages/persistence/test/postgres-transaction.test.js \
            packages/persistence/test/private-staging-cut005.test.js \
            packages/persistence/test/program-stage-gates.test.js \
            packages/persistence/test/program-stage-observation.test.js \
            packages/persistence/test/record-domain-projection-outbox.test.js \
            packages/persistence/test/record-type-catalog.test.js \
            packages/persistence/test/role-password.test.js \
            packages/persistence/test/source-adjudication.test.js \
            packages/persistence/test/source-authority-manifest.test.js \
            packages/persistence/test/source-inventory.test.js \
            packages/persistence/test/source-read-contract.test.js \
            scripts/test/amic-member-photo-replacement.test.mjs \
            scripts/test/corporate-record-import.test.mjs \
            scripts/test/json-postgres-artifact-reproducibility.test.mjs \
            scripts/test/json-postgres-dr-recovery.test.mjs \
            scripts/test/json-postgres-execution-contract.test.mjs \
            scripts/test/json-postgres-formal-release.test.mjs \
            scripts/test/json-postgres-json-retirement.test.mjs \
            scripts/test/json-postgres-production-artifact.test.mjs \
            scripts/test/json-postgres-production-controls.test.mjs \
            scripts/test/json-postgres-production-execution.test.mjs \
            scripts/test/json-postgres-production-infrastructure.test.mjs \
            scripts/test/json-postgres-production-smoke.test.mjs \
            scripts/test/json-postgres-program-files.test.mjs \
            scripts/test/json-postgres-program-receipt.test.mjs \
            scripts/test/json-postgres-program-stage-evidence.test.mjs \
            scripts/test/json-postgres-program-stage.test.mjs \
            scripts/test/json-postgres-relational-projection-closeout.test.mjs \
            scripts/test/json-postgres-release-program.test.mjs \
            scripts/test/json-postgres-release-security.test.mjs \
            scripts/test/json-postgres-source-backup.test.mjs \
            scripts/test/json-postgres-terminal-closeout.test.mjs \
            scripts/test/json-postgres-w15-contracts.test.mjs \
            scripts/test/json-postgres-w15-incremental-observation.test.mjs \
            scripts/test/json-postgres-w15-receipts.test.mjs \
            scripts/test/matter-desktop-authenticode.test.mjs \
            | tee "${RUNNER_TEMP}/json-postgres-test.tap"
          grep -Eq '^# skipped 0$' "${RUNNER_TEMP}/json-postgres-test.tap"
          if grep -Eq '^# fail [1-9][0-9]*$' "${RUNNER_TEMP}/json-postgres-test.tap"; then
            exit 1
          fi

      - name: Production dependency audit
        # npm 12 uses the bulk advisory API without the retired quick-audit fallback.
        run: npm exec --yes --ignore-scripts --package=npm@12.0.2 -- npm audit --omit=dev --audit-level=high
