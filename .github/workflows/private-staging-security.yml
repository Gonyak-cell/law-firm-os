name: Private Staging Security

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/private-staging-security.yml"
      - "apps/api/**"
      - "infra/lawos-private-staging/**"
      - "packages/dms/**"
      - "packages/matter/**"
      - "packages/persistence/**"
      - "packages/runtime-auth/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  security:
    name: Private staging security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Security regression suite
        run: >-
          node --test --test-concurrency=1
          apps/api/test/auth-password-reset-security.test.js
          apps/api/test/auth-restart-revocation.test.js
          apps/api/test/auth-concurrency.test.js
          apps/api/test/admin-security-api.test.js
          apps/api/test/session-auth-api.test.js
          apps/api/test/idempotency/matter-vault-idempotency.test.js
          apps/api/test/private-staging-admin-lambda.test.js
          apps/api/test/private-staging-owner-authorization.test.js
          apps/api/test/private-staging-cut007-flow.test.js
          apps/api/test/vault-dms-governance-security.test.js
          packages/dms/test/postgres-security-regressions.test.js
          packages/dms/test/upload-reconciliation.test.js
          packages/matter/test/*.test.js
          packages/persistence/test/record-domain-seed-preservation.test.js
          packages/runtime-auth/test/*.test.js
          scripts/test/private-staging-artifact.test.mjs
          scripts/test/private-staging-aws-execution.test.mjs
          scripts/test/private-staging-contract.test.mjs
          scripts/test/private-staging-execution-receipt.test.mjs
          scripts/test/private-staging-github-authority.test.mjs
          scripts/test/private-staging-local-gate-sandbox.test.mjs
          scripts/test/private-staging-staging-rehearsal-retirement.test.mjs
          scripts/test/runtime-safety-approval-contract.test.mjs
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
